name: Sync upstream and deploy Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 04:20 执行（GitHub 使用 UTC 时间）
    - cron: "20 20 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-cloudflare-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream master
        id: sync
        run: |
          set -e
          git remote add upstream https://github.com/sub-store-org/Sub-Store-Front-End.git || true
          git fetch upstream master
          BEFORE="$(git rev-parse HEAD)"
          git merge --no-edit upstream/master
          AFTER="$(git rev-parse HEAD)"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show synced commit
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Upstream commit: $(git rev-parse upstream/master)"
          git --no-pager log --oneline -5

      # ====================== 以下步骤仅在代码有更新时执行 ======================
      - name: Set up Node.js
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        if: steps.sync.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: |
          corepack enable || true
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile

      - name: Build
        if: steps.sync.outputs.changed == 'true'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_PUBLIC_PATH: /
        run: pnpm build

      - name: Add Cloudflare Pages cache headers
        if: steps.sync.outputs.changed == 'true'
        run: |
          cat > dist/_headers <<'EOF'
          /*
            Cache-Control: no-cache
          EOF

      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=master
