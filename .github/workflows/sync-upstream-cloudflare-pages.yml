name: Sync upstream and deploy Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 04:20，同步上游并部署 Cloudflare Pages；GitHub cron 使用 UTC
    - cron: "20 20 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-cloudflare-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream master
        id: sync
        run: |
          set -e
          git remote add upstream https://github.com/sub-store-org/Sub-Store-Front-End.git || true
          git fetch upstream master
          BEFORE="$(git rev-parse HEAD)"
          git merge --no-edit upstream/master
          AFTER="$(git rev-parse HEAD)"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show synced commit
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Upstream commit: $(git rev-parse upstream/master)"
          git --no-pager log --oneline -5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: |
          corepack enable || true
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile

      - name: Build
        env:
          # 如果你希望前端默认连接自己的后端，在 GitHub Secrets 添加 VITE_API_URL
          # 例如：https://subapi.example.com/你的后端路径密码
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_PUBLIC_PATH: /
        run: pnpm build

      - name: Add Cloudflare Pages cache headers
        run: |
          cat > dist/_headers <<'EOF'
          /*
            Cache-Control: no-cache
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 如果 Cloudflare Pages 项目的 Production branch 不是 master，请把这里改成对应分支
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=master
